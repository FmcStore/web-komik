<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Hilang | FmcComic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #0b0b0f; 
            color: #e5e7eb; 
            overflow: hidden;
        }
        .amber-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .glass { background: rgba(18, 18, 24, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        
        /* Animasi melayang untuk ikon */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .floating { animation: float 4s ease-in-out infinite; }
        
        .glow {
            box-shadow: 0 0 50px -10px rgba(245, 158, 11, 0.3);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="text-center">
        <!-- Ikon Visual -->
        <div class="relative inline-block mb-8">
            <i class="fa fa-book-open text-8xl text-amber-500/20 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></i>
            <h1 class="text-[120px] md:text-[180px] font-black leading-none text-transparent bg-clip-text bg-gradient-to-b from-amber-500 to-amber-800 opacity-80 select-none">
                404
            </h1>
            <div class="floating absolute -top-4 -right-4 bg-amber-500 text-black px-4 py-1 rounded-full text-sm font-bold shadow-lg">
                Halaman Hilang!
            </div>
        </div>

        <!-- Pesan Error -->
        <div class="max-w-md mx-auto">
            <h2 class="text-2xl md:text-3xl font-bold mb-4">Ups! Chapter Tidak Ditemukan</h2>
            <p class="text-gray-400 mb-8 leading-relaxed">
                Sepertinya halaman yang kamu cari sudah dihapus, pindah dimensi, atau kamu salah mengetik alamatnya.
            </p>

            <!-- Tombol Navigasi -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="index.html" class="amber-gradient px-8 py-4 rounded-2xl font-bold text-black flex items-center justify-center gap-2 hover:scale-105 transition active:scale-95 glow">
                    <i class="fa fa-home"></i> Kembali ke Beranda
                </a>
                <button onclick="history.back()" class="glass px-8 py-4 rounded-2xl font-bold border-white/10 hover:bg-white/5 transition flex items-center justify-center gap-2">
                    <i class="fa fa-arrow-left"></i> Sebelumnya
                </button>
            </div>
        </div>

        <!-- Dekorasi Footer -->
        <div class="mt-20">
            <h1 class="text-xl font-bold text-amber-500/40">
                <i class="fa fa-book-open"></i> Fmc<span class="text-white/40">Comic</span>
            </h1>
        </div>
    </div>

    <!-- Partikel Dekoratif Sederhana -->
    <div class="absolute top-10 left-10 w-32 h-32 bg-amber-500/5 rounded-full blur-3xl"></div>
    <div class="absolute bottom-10 right-10 w-64 h-64 bg-amber-500/5 rounded-full blur-3xl"></div>

</body>
</html>
